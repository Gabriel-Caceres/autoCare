<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo usuario | AutoCare</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="admin-body">

<header class="admin-header">

    <a href="../index.html" class="logo">
        Auto<span>Care</span>
    </a>

    <div class="admin-usuario">

        <span>
            Usuario
        </span>

        <a href="../index.html">
            Ir a la tienda
        </a>

    </div>

</header>


<div class="admin-layout">

    <aside class="admin-menu">

        <h3>
            Administración
        </h3>

        <nav>

            <a
                href="index.html"
                class="solo-admin"
            >
                Inicio
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="pedidos.html">
                Pedidos
            </a>

            <a
                href="usuarios.html"
                class="admin-activo solo-admin"
            >
                Usuarios
            </a>

            <a href="../index.html">
                Tienda
            </a>

        </nav>

    </aside>


    <main class="admin-contenido">

        <section class="admin-titulo">

            <span>
                MANTENEDOR DE USUARIOS
            </span>

            <h1>
                Nuevo usuario
            </h1>

            <p>
                Completa los datos para registrar
                un usuario.
            </p>

        </section>


        <section class="admin-formulario-contenedor">

            <form id="formNuevoUsuario" novalidate>

                <div class="admin-form-grid">

                    <div class="grupo-formulario">

                        <label for="run">
                            RUN
                        </label>

                        <input
                            type="text"
                            id="run"
                            name="run"
                            minlength="7"
                            maxlength="9"
                            placeholder="12345678K"
                            autocomplete="off"
                        >

                        <small
                            id="errorRun"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            maxlength="50"
                            placeholder="Nombre del usuario"
                            autocomplete="off"
                        >

                        <small
                            id="errorNombre"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="apellidos">
                            Apellidos
                        </label>

                        <input
                            type="text"
                            id="apellidos"
                            name="apellidos"
                            maxlength="100"
                            placeholder="Apellidos del usuario"
                            autocomplete="off"
                        >

                        <small
                            id="errorApellidos"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            maxlength="100"
                            placeholder="ejemplo@duoc.cl"
                            autocomplete="off"
                        >

                        <small
                            id="errorCorreo"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="4"
                            maxlength="10"
                            placeholder="4 a 10 caracteres"
                        >

                        <small
                            id="errorPassword"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="fechaNacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                        >

                        <small
                            id="errorFechaNacimiento"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="rol">
                            Rol
                        </label>

                        <select
                            id="rol"
                            name="rol"
                        >

                            <option value="">
                                Selecciona un rol
                            </option>

                            <option value="Administrador">
                                Administrador
                            </option>

                            <option value="Cliente">
                                Cliente
                            </option>

                            <option value="Vendedor">
                                Vendedor
                            </option>

                        </select>

                        <small
                            id="errorRol"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="region">
                            Región
                        </label>

                        <select
                            id="region"
                            name="region"
                        >

                            <option value="">
                                Selecciona una región
                            </option>

                        </select>

                        <small
                            id="errorRegion"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario">

                        <label for="comuna">
                            Comuna
                        </label>

                        <select
                            id="comuna"
                            name="comuna"
                            disabled
                        >

                            <option value="">
                                Primero selecciona una región
                            </option>

                        </select>

                        <small
                            id="errorComuna"
                            class="mensaje-error-form"
                        ></small>

                    </div>


                    <div class="grupo-formulario admin-campo-completo">

                        <label for="direccion">
                            Dirección
                        </label>

                        <textarea
                            id="direccion"
                            name="direccion"
                            maxlength="300"
                            rows="4"
                            placeholder="Dirección del usuario"
                        ></textarea>

                        <div class="contador-caracteres">
                            <span id="contadorDireccion">0</span>/300
                        </div>

                        <small
                            id="errorDireccion"
                            class="mensaje-error-form"
                        ></small>

                    </div>

                </div>


                <div
                    id="mensajeUsuario"
                    class="mensaje-login"
                ></div>


                <div class="admin-form-botones">

                    <a
                        href="usuarios.html"
                        class="btn-cancelar-admin"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Guardar usuario
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>


<script src="../js/admin-sesion.js"></script>
<script src="../js/nuevo-usuario.js"></script>

</body>

</html>
