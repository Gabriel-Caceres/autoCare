<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | AutoCare</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="admin-body">

<header class="admin-header">

    <a href="../index.html" class="logo">
        Auto<span>Care</span>
    </a>

    <div class="admin-usuario">
        <span>Usuario</span>

        <a href="../index.html">
            Ir a la tienda
        </a>
    </div>

</header>


<div class="admin-layout">

    <aside class="admin-menu">

        <h3>
            Administración
        </h3>

        <nav>

            <a
                href="index.html"
                class="solo-admin"
            >
                Inicio
            </a>

            <a
                href="productos.html"
                class="admin-activo"
            >
                Productos
            </a>

            <a href="pedidos.html">
                Pedidos
            </a>

            <a
                href="usuarios.html"
                class="solo-admin"
            >
                Usuarios
            </a>

            <a href="../index.html">
                Tienda
            </a>

        </nav>

    </aside>


    <main class="admin-contenido">

        <section class="admin-titulo admin-titulo-flex">

            <div>

                <span>
                    PRODUCTOS
                </span>

                <h1>
                    Listado de productos
                </h1>

                <p>
                    Revisa los productos disponibles
                    en AutoCare.
                </p>

            </div>

            <a
                href="nuevo-producto.html"
                id="btnNuevoProducto"
                class="btn btn-principal solo-admin"
            >
                Nuevo producto
            </a>

        </section>


        <section class="admin-tabla-contenedor">

            <div class="admin-buscador">

                <label for="buscarProducto">
                    Buscar producto
                </label>

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar por código, nombre o categoría"
                    autocomplete="off"
                >

            </div>


            <div class="tabla-responsive">

                <table class="admin-tabla">

                    <thead>

                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tablaProductos"></tbody>

                </table>

            </div>


            <div
                id="mensajeProductosAdmin"
                class="admin-mensaje"
            ></div>

        </section>

    </main>

</div>


<script src="../js/admin-sesion.js"></script>
<script src="../js/admin-productos.js"></script>

</body>

</html>
